name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    environment: OSSRH

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set project version
        run: mvn --batch-mode versions:set -DnewVersion=${{ steps.version.outputs.VERSION }} -DgenerateBackupPoms=false

      - name: Build with source only (skip javadoc for now)
        run: mvn --batch-mode clean package source:jar -DskipTests -Dmaven.javadoc.skip=true

      - name: Debug - list files
        run: |
          echo "Current directory: $(pwd)"
          echo "Files in target:"
          ls -la secure-data-factory-core/target/

      - name: Upload to Central Portal
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          
          echo "=== Debugging ==="
          echo "VERSION=${VERSION}"
          echo "POM file:"
          ls -la secure-data-factory-core/target/secure-data-factory-core-${VERSION}.pom
          
          BEARER_TOKEN=$(echo -n "${{ secrets.OSSRH_USERNAME }}:${{ secrets.OSSRH_PASSWORD }}" | base64 -w0)
          echo "Bearer token length: ${#BEARER_TOKEN}"
          
          echo "Uploading POM..."
          curl -v -X POST "https://central.sonatype.com/api/v1/publisher/upload" \
            -H "Authorization: Bearer ${BEARER_TOKEN}" \
            -F "file=@secure-data-factory-core/target/secure-data-factory-core-${VERSION}.pom"
          
          echo "Uploading JAR..."
          curl -X POST "https://central.sonatype.com/api/v1/publisher/upload" \
            -H "Authorization: Bearer ${BEARER_TOKEN}" \
            -F "file=@secure-data-factory-core/target/secure-data-factory-core-${VERSION}.jar"
          
          echo "Uploading Sources JAR..."
          curl -X POST "https://central.sonatype.com/api/v1/publisher/upload" \
            -H "Authorization: Bearer ${BEARER_TOKEN}" \
            -F "file=@secure-data-factory-core/target/secure-data-factory-core-${VERSION}-sources.jar"

      - name: Publish deployment
        run: |
          BEARER_TOKEN=$(echo -n "${{ secrets.OSSRH_USERNAME }}:${{ secrets.OSSRH_PASSWORD }}" | base64 -w0)
          
          curl -X POST "https://central.sonatype.com/api/v1/publisher/status" \
            -H "Authorization: Bearer ${BEARER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"action":"PUBLISH"}'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            secure-data-factory-core/target/*.jar
